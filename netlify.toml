[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/auth"
  to = "/.netlify/functions/api/auth"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/procedures"
  to = "/.netlify/functions/api/procedures"
  status = 200
  force = true

[[redirects]]
  from = "/procedures/*"
  to = "/.netlify/functions/api/procedures/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true
